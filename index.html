<h1>多媒体切割 Media Cutter</h1><p class="mut">macOS 音频、视频片段截取工具</p>
<h2>联系我们</h2><p>遇到问题或有建议，请在 <a href="https://github.com/parkerlu/media-cutter-support/issues">GitHub Issues</a> 提交，并写明 macOS 版本、App 版本和操作步骤。</p>
<h2>常见问题</h2>
<p><b>怎样选取片段？</b><br>在波形上拖拽框选，或点 5s / 10s / 15s / 30s 预设，也可以直接输入起点和终点。</p>
<p><b>能导出什么格式？</b><br>音频和视频都可以导出 MP3；视频还可以无损快切导出 MP4，或把任意一帧存为 PNG。</p>
<p><b>系统要求？</b><br>macOS 14 或更高版本。</p>
