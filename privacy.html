<h1>隐私政策</h1><p class="mut">多媒体切割 Media Cutter · 更新于 2026 年 10 月 31 日</p>
<h2>我们不收集任何数据</h2><p>本 App 不收集、不存储、不向任何服务器发送你的个人信息或使用数据，也不包含广告和第三方统计。</p>
<h2>你的文件</h2><p>你打开的音频和视频文件只在你的 Mac 本地处理，不会被上传。App 运行在 macOS 沙盒中，只能访问你主动选择的文件。</p>
<h2>政策变更</h2><p>如果本政策有变更，会更新本页面。</p>
<h2>联系方式</h2><p>如有疑问，请在 <a href="https://github.com/parkerlu/media-cutter-support/issues">GitHub Issues</a> 提交。</p>
